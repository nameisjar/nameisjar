name: update coding stats

on:
  workflow_dispatch:
  schedule:
    - cron: "15 0 * * *"

permissions:
  contents: write

concurrency:
  group: coding-stats
  cancel-in-progress: true

jobs:
  update-readme:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
    steps:
      - name: Update weekly coding activity
        if: ${{ env.WAKATIME_API_KEY != '' }}
        uses: athul/waka-readme@master
        with:
          WAKATIME_API_KEY: ${{ env.WAKATIME_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHOW_TITLE: false
          SECTION_NAME: waka
          TIME_RANGE: last_7_days
          LANG_COUNT: 6
          SHOW_TIME: true
          SHOW_TOTAL: true
          CODE_LANG: text
          BLOCKS: ░▒▓█
          COMMIT_MESSAGE: "chore: update weekly coding stats"

      - name: Explain missing WakaTime setup
        if: ${{ env.WAKATIME_API_KEY == '' }}
        run: echo "::notice::Add the WAKATIME_API_KEY repository secret to enable coding statistics."
